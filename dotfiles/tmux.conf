# status line
set -g status on
set -g status-position top
set -g status-interval 10
set -g status-style fg=colour241,bg=colour0
set -g status-left "[#S]  "
set -g status-left-length 25
set -g status-right "#(note)"

set -sg escape-time 10
set -g default-terminal "screen-256color"
set -g mouse on
set -g set-clipboard on

set -g set-titles on
set -g set-titles-string "#W (tmux/#S)"

unbind C-b
set -g prefix C-g
bind-key C-g send-prefix

unbind &
unbind q
unbind Q
bind q confirm kill-window
bind Q confirm kill-session

unbind space
bind space if-shell -F "#{window_zoomed_flag}"  'select-pane -t +; resize-pane -Z' 'select-pane -t +'

unbind o
bind o resize-pane -Z

unbind h
unbind j
unbind k
unbind l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind @ 'command-prompt "rename-session %%"; attach-session -c "#{pane_current_path}"'

